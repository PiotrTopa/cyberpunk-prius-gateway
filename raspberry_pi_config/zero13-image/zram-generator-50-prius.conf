# /etc/systemd/zram-generator.conf.d/50-prius.conf
# zram swap from systemd-zram-generator; the rpi-swap package is removed (its
# rpi-resize-swap-file.service cost 26 s per boot on ARMv6 and its generator
# made dev-zram0.swap depend on that service).
[zram0]
host-memory-limit=none
zram-size=256
fs-type=swap

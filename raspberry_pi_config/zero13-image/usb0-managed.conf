# /etc/NetworkManager/conf.d/usb0-managed.conf
# NetworkManager ships 85-nm-unmanaged.rules which marks USB gadget interfaces
# (DEVTYPE=gadget) unmanaged, so the usb0 profile never comes up and the host
# sees NO-CARRIER. Same file existed on the Zero 2 W card. (2026-10-15)
[device]
match-device=interface-name:usb0
managed=1
